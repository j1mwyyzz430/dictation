function isCounted(ch,settings){return /[\u3400-\u9fff]/u.test(ch)||settings.punctuationCounts;}

function buildGroups(lesson,mode,scope){let groups=[];if(mode!=='memory'&&(scope==='all'||scope==='words'))lesson.words.forEach((text,i)=>groups.push({key:'w'+i,kind:'詞語',text}));if(mode!=='memory'&&(scope==='all'||scope==='sentences'))lesson.sentences.forEach((text,i)=>groups.push({key:'s'+i,kind:'句子',text}));if((mode==='memory'||scope==='all'||scope==='paragraph')&&lesson.paragraph)groups.push({key:'p0',kind:mode==='memory'?'背默':'段落',text:lesson.paragraph});return groups;}

function spreadsheet_(){const p=PropertiesService.getScriptProperties();const id=p.getProperty('SHEET_ID');if(!id)throw Error('請先在試算表內執行 setup。');return SpreadsheetApp.openById(id);}

function token_(role,extra){const token=Utilities.getUuid()+Utilities.getUuid();CacheService.getScriptCache().put('session:'+token,JSON.stringify({role,...extra}),14400);return token;}
function auth_(token,role){const value=CacheService.getScriptCache().get('session:'+token);if(!value)throw Error('登入已過期，請重新登入。');const s=JSON.parse(value);if(role&&s.role!==role)throw Error('只限教師使用。');return s;}
function digest_(text){return Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,text));}
function teacherLogin_(password){const cache=CacheService.getScriptCache(),p=PropertiesService.getScriptProperties(),key='fail:'+digest_(String(password)).slice(0,16);const failures=Number(cache.get('loginfails')||0);if(failures>=12)throw Error('登入嘗試太多，請十分鐘後再試。');const saved=p.getProperty('TEACHER_PASSWORD');if(!saved)throw Error('教師尚未設定後端密碼。');if(digest_(p.getProperty('PASSWORD_SALT')+String(password))!==digest_(p.getProperty('PASSWORD_SALT')+saved)){cache.put('loginfails',String(failures+1),600);throw Error('密碼不正確。')}cache.remove('loginfails');return {token:token_('teacher',{}),config:config_()};}
function allAttempts_(){const ss=spreadsheet_(),rows=ss.getSheetByName('Attempts').getDataRange().getValues().slice(1),ink=ss.getSheetByName('Handwriting').getDataRange().getValues().slice(1),by={};for(const r of ink){(by[r[0]]??=[]).push({i:Number(r[1]),expected:String(r[2]),strokes:JSON.parse(r[3]),auto:String(r[4]),manual:r[5]===''?null:r[5]===true||String(r[5])==='true',confidence:Number(r[6])})}return rows.filter(r=>r[0]).map(r=>({id:r[0],classId:r[1],name:r[2],lessonId:r[3],mode:r[4],scope:r[5],elapsed:Number(r[6]),created:r[7],approved:r[8]===true,score:Number(r[9]),accuracy:Number(r[10]),settings:JSON.parse(r[11]),groups:JSON.parse(r[12]),version:Number(r[13]),cells:(by[r[0]]||[]).sort((a,b)=>a.i-b.i)}));}
function validateInk_(strokes){if(!Array.isArray(strokes)||strokes.length>100)throw Error('筆跡格式不正確。');return strokes.map(st=>{if(!Array.isArray(st)||st.length>1200)throw Error('筆跡太長。');return st.map(pt=>{if(!Array.isArray(pt)||pt.length!==2||pt.some(v=>typeof v!=='number'||!Number.isFinite(v)||v<0||v>1))throw Error('筆跡座標不正確。');return pt.map(v=>Math.round(v*1000)/1000)})}).filter(s=>s.length);}
function summary_(a){const m=marks(a);return {...m,id:a.id,approved:a.approved,version:a.version,elapsed:a.elapsed,created:a.created};}
function submit_(input,session){const ss=spreadsheet_(),existing=allAttempts_().find(a=>a.id===input.id);if(existing){if(existing.classId!==session.classId||existing.name!==session.name)throw Error('試卷編號已使用。');return {attempt:existing};}if(!/^[\w-]{12,80}$/.test(input.id))throw Error('試卷編號不正確。');const conf=config_(),lesson=conf.lessons[session.classId].find(l=>l.id===input.lessonId);if(!lesson)throw Error('默書範圍已更新，請重新進入。');if(!['dictation','memory'].includes(input.mode)||!['all','words','sentences','paragraph'].includes(input.scope))throw Error('模式不正確。');const allowed=buildGroups(lesson,input.mode,input.scope),keys=allowed.map(g=>g.key);if(input.keys.length!==keys.length||new Set(input.keys).size!==keys.length||input.keys.some(k=>!keys.includes(k)))throw Error('試卷題目不完整。');const groups=input.keys.map(key=>allowed.find(g=>g.key===key));const expected=groups.flatMap(g=>Array.from(g.text).filter(c=>!/^\s$/u.test(c)));if(expected.length>500||!expected.length||input.cells.length!==expected.length)throw Error('試卷字數不符。');const settings={...conf.settings};const cells=expected.map((ch,i)=>{const strokes=validateInk_(input.cells[i]);const r=Shape.check(strokes,ch,settings.tolerance,TEMPLATES);return {i,expected:ch,strokes,auto:r.status,manual:null,confidence:r.confidence}});const elapsed=Math.max(0,Math.min(86400,Number(input.elapsed)||0)),a={id:input.id,classId:session.classId,name:session.name,lessonId:lesson.id,mode:input.mode,scope:input.scope,elapsed,created:new Date().toISOString(),approved:false,settings,groups,cells,version:1},m=marks(a);ss.getSheetByName('Handwriting').getRange(ss.getSheetByName('Handwriting').getLastRow()+1,1,cells.length,7).setValues(cells.map(c=>[a.id,c.i,c.expected,JSON.stringify(c.strokes),c.auto,'',c.confidence]));ss.getSheetByName('Attempts').appendRow([a.id,a.classId,a.name,a.lessonId,a.mode,a.scope,a.elapsed,a.created,false,m.score,m.accuracy,JSON.stringify(settings),JSON.stringify(groups),a.version]);return {attempt:a};}

function exportCSV(){const rows=[['班別','學生','課次','模式','範圍','分數','正確率','待核字','用時秒','已覆核','提交日期'],...teacherRecords.map(a=>{const m=marks(a);return [a.classId,a.name,a.lessonId,a.mode,scopeLabel(a.scope),m.score,m.accuracy,m.pending,a.elapsed,a.approved?'是':'否',a.created]})];const quote=x=>'"'+String(x).replace(/"/g,'""')+'"';download('\ufeff'+rows.map(r=>r.map(quote).join(',')).join('\r\n'),'默書成績.csv','text/csv;charset=utf-8');}
function importRecords(){if(endpoint)return toast('正式雲端紀錄不接受本機匯入，以免混淆學生身分。');const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const a=JSON.parse(await input.files[0].text());if(!a.id||!a.cells||!a.groups||!a.settings||a.cells.length>500)throw Error('不是有效的試卷紀錄。');putRecord(a);reloadTeacher();toast('試卷已匯入。')}catch(e){toast(e.message)}};input.click();}
function changePassword(){modal('<label for="newTeacherPassword">新教師密碼（至少八個字元）</label><input id="newTeacherPassword" type="password" autocomplete="new-password"><button class="wide" id="saveNewPassword">儲存新密碼</button>');titleModal('更改教師密碼');$('saveNewPassword').onclick=async()=>{try{const p=$('newTeacherPassword').value;if(p.length<8)throw Error('密碼至少八個字元。');if(endpoint)await request('changePassword',{password:p},teacherToken);else await setLocalPassword(p);closeModal();toast('密碼已更改。')}catch(e){toast(e.message)}};}
function teacherConfig(){modal(`<label for="configClass">編輯班別</label><select id="configClass"><option>4N</option><option>6B</option></select><label for="studentsEditor">學生姓名（每行一位）</label><textarea id="studentsEditor" rows="4"></textarea><label for="lessonTitleEditor">第二課名稱</label><input id="lessonTitleEditor"><label for="wordsEditor">詞語（每行一個）</label><textarea id="wordsEditor" rows="5"></textarea><label for="sentencesEditor">句子（每行一句，請包括標點）</label><textarea id="sentencesEditor" rows="4"></textarea><label for="paragraphEditor">段落／背默內容</label><textarea id="paragraphEditor" rows="5"></textarea><div class="notice">4N 第一句的原 Word 中間是留白，現已保留。請確認要加入的標點。修改內容後，新增字若沒有筆畫模板會交由老師人工核對。</div><div class="grid2"><div><label for="toleranceEditor">字形比對寬鬆度</label><select id="toleranceEditor"><option value="relaxed">寬鬆（建議）</option><option value="normal">一般</option></select></div><div><label for="penaltyEditor">每錯一字扣分</label><input type="number" id="penaltyEditor" min="0" max="10" step="1" value="${cfg.settings.penalty}"></div></div><label><input type="checkbox" id="punctuationEditor" ${cfg.settings.punctuationCounts?'checked':''}> 標點也計扣分</label><p class="small muted">預設只扣中文字分數，標點仍須書寫及核對。新設定只用於之後開始的試卷。</p><label for="defaultRateEditor">預設語速</label><input type="range" id="defaultRateEditor" min="0.3" max="1" step="0.05" value="${cfg.settings.rate}"><button id="saveTeacherConfig" class="wide">保存設定</button><details class="section"><summary>新增之後的課次（進階 JSON）</summary><p class="small muted">先保存上方內容，再修改完整設定。課次 id 例如 lesson3；結構沿用 lesson2。</p><textarea id="fullConfigEditor" class="code" rows="8">${esc(JSON.stringify(cfg,null,2))}</textarea><button class="soft" id="saveFullConfig">保存完整設定</button></details>`);titleModal('教材及學生設定');let selected='4N';const fill=()=>{const l=cfg.lessons[selected].find(l=>l.id==='lesson2')||cfg.lessons[selected][0];$('studentsEditor').value=cfg.classes[selected].join('\n');$('lessonTitleEditor').value=l.title;$('wordsEditor').value=l.words.join('\n');$('sentencesEditor').value=l.sentences.join('\n');$('paragraphEditor').value=l.paragraph;};$('toleranceEditor').value=cfg.settings.tolerance;fill();$('configClass').onchange=e=>{selected=e.target.value;fill()};$('saveTeacherConfig').onclick=async()=>{const c=clone(cfg),l=c.lessons[selected].find(l=>l.id==='lesson2')||c.lessons[selected][0];c.classes[selected]=Array.from(new Set($('studentsEditor').value.split('\n').map(s=>s.trim()).filter(Boolean)));l.title=$('lessonTitleEditor').value.trim();l.words=$('wordsEditor').value.split('\n').map(s=>s.trim()).filter(Boolean);l.sentences=$('sentencesEditor').value.split('\n').map(s=>s.trim()).filter(Boolean);l.paragraph=$('paragraphEditor').value.trim();c.settings={tolerance:$('toleranceEditor').value,penalty:Number($('penaltyEditor').value),punctuationCounts:$('punctuationEditor').checked,rate:Number($('defaultRateEditor').value)};await storeConfig(c);};$('saveFullConfig').onclick=async()=>{try{await storeConfig(JSON.parse($('fullConfigEditor').value))}catch(e){toast(e.message)}};}
function validateConfig(c){if(!c?.classes||!c?.lessons||!c?.settings)throw Error('設定格式不正確。');for(const k of ['4N','6B']){if(!Array.isArray(c.classes[k])||c.classes[k].some(n=>typeof n!=='string'))throw Error('名單格式不正確。');if(!Array.isArray(c.lessons[k])||c.lessons[k].some(l=>!l.id||!l.title||!Array.isArray(l.words)||!Array.isArray(l.sentences)||typeof l.paragraph!=='string'))throw Error('課次格式不正確。');}if(!['relaxed','normal'].includes(c.settings.tolerance)||!Number.isFinite(c.settings.penalty)||c.settings.penalty<0||c.settings.penalty>10)throw Error('扣分／字形設定不正確。');}
async function storeConfig(c){try{validateConfig(c);if(endpoint)c=(await request('saveConfig',{config:c},teacherToken)).config;cfg=c;save('-config',cfg);rate=cfg.settings.rate;closeModal();toast('設定已保存。');if(screen==='teacher')reloadTeacher();}catch(e){toast(e.message)}}
async function showMyRecords(){modal('<p id="recordsLoading">載入中…</p><div id="myRecordsList"></div>');titleModal('我的成果');try{const list=endpoint?(await request('myAttempts',{},studentToken)).attempts:records.filter(a=>a.classId===user.classId&&a.name===user.name);if(!$('myRecordsList'))return;$('recordsLoading').remove();$('myRecordsList').innerHTML=list.length?list.sort((a,b)=>b.created.localeCompare(a.created)).map(a=>`<button class="choice wide openMine" data-id="${esc(a.id)}"><strong>${marks(a).score} 分 · ${a.approved?'已覆核':'初步分數'}</strong><p>${new Date(a.created).toLocaleString('zh-HK')} · ${scopeLabel(a.scope)} · ${time(a.elapsed)}</p></button>`).join(''):'<p class="muted">完成一份練習，就會在這裏看到。</p>';document.querySelectorAll('.openMine').forEach(b=>b.onclick=()=>{attempt=list.find(a=>a.id===b.dataset.id);attempt.cloudSaved=!!endpoint;closeModal();screen='result';render()});}catch(e){toast(e.message);if($('recordsLoading'))$('recordsLoading').textContent='未能載入，請稍後再試。';}}
async function showBoard(){if(!user&&!teacherToken)return toast('請先選擇同學登入。');modal(`<div class="grid2"><div><label for="boardClass">班別</label><select id="boardClass"><option>4N</option><option>6B</option></select></div><div><label for="boardLesson">課次</label><select id="boardLesson"></select></div></div><div class="row"><select id="boardMode" style="width:auto"><option value="dictation">默寫</option><option value="memory">背默</option></select><select id="boardScope" style="width:auto"><option value="all">整份</option><option value="words">詞語</option><option value="sentences">句子</option><option value="paragraph">段落</option></select><button class="soft" id="refreshBoard">更新排名</button></div><p class="small muted">同一課、同一模式及範圍比較。正確率高的排先；相同時，用時短的排先。每人顯示最佳已覆核成績。</p><div id="boardTable" class="table-wrap"></div><p id="boardUpdated" class="small muted"></p>`);titleModal('🏆 龍虎榜');$('boardClass').value=user?.classId||'4N';const fill=()=>{$('boardLesson').innerHTML=(cfg.lessons[$('boardClass').value]||[]).map(l=>`<option value="${esc(l.id)}">${esc(l.title)}</option>`).join('')};fill();$('boardClass').onchange=()=>{fill();refreshBoard()};$('boardLesson').onchange=refreshBoard;$('boardScope').onchange=refreshBoard;$('boardMode').onchange=()=>{if($('boardMode').value==='memory')$('boardScope').value='paragraph';refreshBoard()};$('refreshBoard').onclick=refreshBoard;await refreshBoard();boardTimer=setInterval(()=>{if(document.visibilityState==='visible'&&$('modal').open)refreshBoard()},10000);}
let boardBusy=false;
async function refreshBoard(){if(boardBusy||!$('boardTable'))return;boardBusy=true;try{let list=endpoint?(await request('leaderboard',{},teacherToken||studentToken)).attempts:records.filter(a=>a.approved).map(a=>({...a,...marks(a)}));if(!$('boardTable'))return;const c=$('boardClass').value,l=$('boardLesson').value,m=$('boardMode').value,s=$('boardScope').value;list=list.filter(a=>a.classId===c&&a.lessonId===l&&a.mode===m&&a.scope===s).sort((a,b)=>b.accuracy-a.accuracy||a.elapsed-b.elapsed||a.created.localeCompare(b.created));const seen=new Set();list=list.filter(a=>!seen.has(a.name)&&seen.add(a.name));$('boardTable').innerHTML=list.length?`<table><thead><tr><th>名次</th><th>同學</th><th>正確率</th><th>用時</th><th>分數</th></tr></thead><tbody>${list.map((a,i)=>`<tr><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td>${esc(a.name)}</td><td>${a.accuracy}%</td><td>${time(a.elapsed)}</td><td>${a.score}</td></tr>`).join('')}</tbody></table>`:'<div class="notice note-blue">還沒有老師確認的成績。完成並覆核後就會上榜。</div>';$('boardUpdated').textContent=`${endpoint?'每 10 秒更新':'本機排名'} · 最近更新 ${new Date().toLocaleTimeString('zh-HK')}`;}catch(e){if($('boardUpdated'))$('boardUpdated').textContent='更新失敗：'+e.message;}finally{boardBusy=false;}}
function setupView(){modal(`<div class="setup"><p>這份 HTML 可以直接試用。要讓不同裝置共用試卷和排名，請接上 Google Sheets。</p><ol><li>把 HTML 改名為 <strong>index.html</strong>，上載 GitHub 代碼庫，啟用 Settings → Pages。</li><li>建立 Google Sheet，在「擴充功能 → Apps Script」加入下方後端代碼。</li><li>在 Apps Script「專案設定 → 指令碼屬性」新增 <strong>TEACHER_PASSWORD</strong>（自訂密碼，至少八字元），及 <strong>ALLOWED_ORIGIN</strong>（你的 GitHub 網站來源，例如 https://abc.github.io，結尾不加斜線或路徑）。</li><li>執行 <strong>setup</strong> 並授權；再選「部署 → 新增部署 → 網頁應用程式」，執行身分選「我」，存取選「所有人」（須帳戶政策允許）。</li><li>把部署網址（以 <strong>/exec</strong> 結尾）貼在下方。按「連接測試」，成功後按「下載已設定 HTML」，再覆蓋 GitHub 的 index.html，學生才能共用同一連線。</li></ol><label for="endpointInput">Apps Script 部署網址</label><input id="endpointInput" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(endpoint)}"><div class="row section"><button id="connectEndpoint">連接測試</button><button class="secondary" id="exportConfigured">下載已設定 HTML</button><button class="soft" id="localOnly">切回本機試用</button></div><p class="notice">連接時不公開試算表，也不要把教師密碼放入 GitHub。網站使用跨網站表單回覆確認收卷；未收到後端確認時會顯示未同步。</p><details><summary>Google Apps Script 後端代碼</summary><div class="row section"><button class="soft" id="copyBackend">複製後端代碼</button><button class="soft" id="downloadBackend">下載 Code.gs</button></div><textarea class="code section" id="backendCode" readonly rows="12"></textarea></details><details class="section"><summary>部署及使用注意</summary><p class="small">GitHub Pages 的網站代碼會公開。學生只選班別和姓名，這是課堂名單辨認，不是個人帳戶驗證。正式教師權限由 Apps Script 後端密碼及四小時登入時限保護。龍虎榜每十秒讀取已覆核紀錄。</p><p class="small">朗讀使用裝置的香港中文／粵語聲音，不會改用普通話。若裝置沒有粵語聲音，網站會提示安裝。字形比對是練習輔助，並非 OCR；不確定的字會待老師覆核。後端及學校網絡須在部署後實機測試。</p><p class="small">後端設定及試卷放在 Google Sheet 和指令碼屬性。Apps Script 有使用額度；試卷以逐字向量笔跡儲存，不上載手寫圖片至辨識公司。</p><p class="small">字形資料來源：<a href="https://github.com/chanind/hanzi-writer-data" target="_blank" rel="noopener">Hanzi Writer Data</a>／Make Me a Hanzi；字形使用 Arphic Public License，資料使用其開放授權。<button class="soft" id="downloadLicense">下載字形授權</button></p></details></div>`);titleModal('網站連線及 GitHub 設定');$('backendCode').value=$('backendSource').textContent;$('copyBackend').onclick=async()=>{try{await navigator.clipboard.writeText($('backendSource').textContent);toast('後端代碼已複製。')}catch{$('backendCode').select();toast('請長按已選取的代碼複製。')}};$('downloadBackend').onclick=()=>download($('backendSource').textContent,'Code.gs','text/plain');$('connectEndpoint').onclick=async()=>{try{const url=$('endpointInput').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url))throw Error('請貼上正確的 Apps Script /exec 部署網址。');endpoint=url;save('-endpoint',url);const r=await request('bootstrap');cfg=r.config;save('-config',cfg);teacherToken='';studentToken='';user=null;setConnection('Google Sheets 連線成功');toast('連接成功，請下載已設定 HTML 並重新上載 GitHub。');screen='login';render();}catch(e){toast(e.message);setConnection('Google Sheets 尚未確認連線');}};$('exportConfigured').onclick=exportConfigured;$('localOnly').onclick=()=>{endpoint='';save('-endpoint','');teacherToken='';studentToken='';user=null;closeModal();screen='login';setConnection();render()};$('downloadLicense').onclick=()=>download(LICENSE_TEXT,'ARPHICPL.txt','text/plain');}
function exportConfigured(){const node=document.documentElement.cloneNode(true);const main=node.querySelector('#app');main.innerHTML='';node.querySelector('#modalBody').innerHTML='';node.querySelector('#modal').removeAttribute('open');node.querySelector('#toast').classList.add('hidden');node.querySelectorAll('iframe,form[hidden]').forEach(n=>n.remove());const scripts=node.querySelectorAll('script');const script=scripts[scripts.length-1];script.textContent=script.textContent.replace(/const EMBEDDED_CONFIG=[\s\S]*?, CHARACTERS=/,()=>`const EMBEDDED_CONFIG=${JSON.stringify(cfg).replace(/</g,'\\u003c')}, CHARACTERS=`).replace(/PUBLISHED_ENDPOINT=(?:"(?:[^"\\]|\\.)*"|''|'[^']*');/,()=>`PUBLISHED_ENDPOINT=${JSON.stringify(endpoint)};`);download('<!doctype html>\n'+node.outerHTML,'index.html','text/html;charset=utf-8');}
function download(content,name,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
$('boardBtn').onclick=showBoard;$('soundSettingsBtn').onclick=audioSettings;$('teacherBtn').onclick=teacherLogin;$('setupBtn').onclick=()=>{if(screen==='writing')return toast('請先交卷或按「稍後繼續」，再修改網站連線。');setupView()};
window.addEventListener('storage',e=>{if(e.key===KEY+'-records'){records=read('-records',[]);if($('boardTable'))refreshBoard();}if(e.key===KEY+'-config'&&!endpoint&&screen!=='writing')cfg=read('-config',cfg);});
window.addEventListener('beforeunload',e=>{if(screen==='writing'&&attempt.cells.some(c=>c.strokes.length)){persistDraft();e.preventDefault();e.returnValue='';}});
setInterval(()=>{if(screen==='writing'&&$('examTimer'))$('examTimer').textContent=time((Date.now()-attempt.started)/1000)},1000);
if('speechSynthesis'in window){speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices();}
setConnection();render();
if(endpoint&&location.protocol!=='file:')request('bootstrap').then(r=>{cfg=r.config;save('-config',cfg);setConnection('Google Sheets 連線成功');if(screen==='login')render()}).catch(e=>{setConnection('Google Sheets 連線失敗');toast(e.message)});
window.penroomTest={Shape,marks,buildGroups,spokenText,eraseAt};
