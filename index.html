<!doctype html>
<html lang="zh-HK"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC">
<title>筆尖默書室</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF6EC;--card:#FFFDF8;--cream:#FFF4DE;--ink:#3B2F2A;--ink2:#7B675A;--ink3:#B3A293;--line:#EADCC6;--tomato:#E5714F;--sun:#F3B53F;--sun-l:#FFE7A8;--leaf:#5FA77A;--leaf-l:#D9EEDC;--sky:#5E9FD3;--sky-l:#D8E9F7;--plum:#9A72C2;--plum-l:#EADFF5;--rose-l:#FBE0E2;--ok:#3E9A62;--bad:#D9573F;--rev:#DB9418;--f:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","PingFang HK","Microsoft JhengHei",serif;--n:"Fredoka",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font:18px/1.6 var(--f);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(50vmax 35vmax at 0 0,#F3B53F33,transparent 60%),radial-gradient(45vmax 35vmax at 100% 5%,#5E9FD32b,transparent 60%),radial-gradient(55vmax 40vmax at 90% 100%,#5FA77A2b,transparent 60%),radial-gradient(40vmax 30vmax at 5% 100%,#F09AA233,transparent 60%)}
.scene{position:fixed;left:0;bottom:0;width:100%;height:15vh;z-index:-1;pointer-events:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
h1,h2,h3{margin:0;line-height:1.3;letter-spacing:.05em}
.muted{color:var(--ink2)}.small{font-size:14px}.num{font-family:var(--n)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) clamp(12px,3vw,28px) 10px;background:#FBF6ECe0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:2px dashed var(--line)}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:22px;letter-spacing:.08em;white-space:nowrap}
.brand svg{width:26px;height:38px;transform:rotate(-14deg)}.brand em{font-style:normal;color:var(--tomato)}
.pill{font-size:13px;padding:3px 12px;border-radius:99px;background:#EFE6D6;color:var(--ink2);white-space:nowrap}.pill.on{background:var(--leaf-l);color:#2D6B45}
.sp{flex:1}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;min-width:44px;padding:0 14px;border:2px solid var(--ink);border-radius:99px;background:var(--card);font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--ink);transition:transform .12s}
.tb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}.tb.gold{background:var(--sun-l)}.tb.only{padding:0}
@media(max-width:760px){.tb .lbl,.top .pill,.brand b{display:none}.tb{padding:0}}
main{max-width:1180px;margin:auto;padding:24px clamp(14px,3vw,32px) 90px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--card);border:2px solid var(--ink);border-radius:26px;box-shadow:0 5px 0 var(--ink),0 22px 44px -26px #6e461e80}
.pad{padding:clamp(18px,3vw,30px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:48px;padding:0 22px;border:2px solid var(--ink);border-radius:99px;background:var(--card);font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--tomato);color:#fff}.btn.gold{background:var(--sun-l)}.btn.sky{background:var(--sky-l)}.btn.leaf{background:var(--leaf-l)}.btn.danger{background:var(--rose-l);color:#A63A2A}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px;box-shadow:0 3px 0 var(--ink)}.btn.lg{min-height:58px;font-size:20px;padding:0 30px}.btn.block{width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}.head h1{font-size:clamp(28px,4vw,38px)}
.crumb{color:var(--ink2);font-size:15px;letter-spacing:.06em}
.badge{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px;border-radius:99px;font-size:14px;font-weight:700;border:1.5px solid var(--ink);background:var(--card);white-space:nowrap}
.b-ok{background:var(--leaf-l)}.b-rev{background:#FFE9B8}.b-sky{background:var(--sky-l)}.b-plum{background:var(--plum-l)}
.note{padding:12px 16px;border-radius:16px;background:#FFF3D6;border:1.5px dashed var(--sun);color:#7A5200;font-size:15px}
.note.blue{background:#EAF3FB;border-color:var(--sky);color:#24537E}
.in{width:100%;min-height:48px;padding:10px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;font-size:16px}
textarea.in{line-height:1.7;resize:vertical}.code{font:13px/1.6 ui-monospace,monospace;white-space:pre}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=range]{width:100%;accent-color:var(--tomato)}
.mascot{width:120px;height:170px;overflow:visible}
.bob{animation:bob 3.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}@keyframes pop{from{opacity:0;transform:scale(.94)}}
.av{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--c);font-weight:700;font-size:19px;flex:none}
.av.lg{width:74px;height:74px;font-size:34px}
.spin{width:40px;height:40px;margin:10px auto;border-radius:50%;border:4px solid var(--sun);border-right-color:transparent;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:24px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:99px;background:var(--cream);border:1.5px solid var(--line)}
.seg button{border:0;background:none;min-height:40px;padding:0 16px;border-radius:99px;font-weight:700;color:var(--ink2)}.seg button.on{background:var(--ink);color:#fff}
.login{display:grid;place-items:center;min-height:calc(100dvh - 160px)}
.login-card{display:grid;grid-template-columns:1fr 1.3fr;max-width:980px;width:100%;overflow:hidden}
.art{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:36px 20px;background:linear-gradient(160deg,#FFE7A8,#FFD3B6);border-right:2px solid var(--ink)}
.sun{position:absolute;top:26px;right:30px;width:64px;height:64px;border-radius:50%;background:#FFF6DC;box-shadow:0 0 0 14px #ffffff55,0 0 0 30px #ffffff2a}
.bubble{position:relative;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:6px 16px;font-weight:700;box-shadow:0 3px 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.ltitle{font-size:42px;font-weight:700;letter-spacing:.14em;text-align:center;line-height:1.15}.ltitle span{color:var(--tomato)}
.lsub{font-family:var(--n);letter-spacing:.3em;font-size:12px;color:var(--ink2);text-align:center}
.lform{padding:32px clamp(20px,4vw,42px);display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--ink2)}
.step i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--n);font-size:14px}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;align-items:center;min-width:118px;padding:8px 18px;border-radius:20px;border:2px solid var(--ink);background:var(--card);box-shadow:0 4px 0 var(--ink)}
.chip b{font-family:var(--n);font-size:28px;line-height:1.1}.chip small{color:var(--ink2);font-size:13px}
.chip.on{background:var(--sky-l);transform:translateY(2px);box-shadow:0 2px 0 var(--ink),0 0 0 4px #5E9FD344}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nm{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:18px;border:2px solid var(--ink);background:var(--card);font-size:19px;font-weight:700;box-shadow:0 3px 0 var(--ink);text-align:left}
.nm.on{background:var(--sun-l);transform:translateY(2px);box-shadow:0 1px 0 var(--ink),0 0 0 4px #F3B53F55}
@media(max-width:820px){.login-card{grid-template-columns:1fr}.art{border-right:0;border-bottom:2px solid var(--ink);flex-direction:row;padding:20px}.art .mascot{width:76px;height:108px}.art .bubble,.sun{display:none}.ltitle{font-size:32px}}
.hero{display:grid;grid-template-columns:1.4fr 1fr;align-items:center;gap:20px;padding:clamp(22px,4vw,44px);background:linear-gradient(135deg,var(--card) 45%,#FFEFD2)}
.hello{display:flex;align-items:center;gap:16px}.hello h1{font-size:clamp(28px,5vw,42px)}
.hero-art{display:flex;justify-content:center}
.big{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.tile{display:flex;align-items:center;gap:18px;padding:22px;text-align:left;border:2px solid var(--ink);border-radius:26px;background:var(--card);box-shadow:0 6px 0 var(--ink);transition:transform .2s}
.tile:hover{transform:translateY(-3px)}
.tile .ico,.mode .ico{display:grid;place-items:center;border-radius:50%;border:2px solid var(--ink);background:var(--bg);flex:none;box-shadow:inset 0 -6px 0 #0000000d}
.tile .ico{width:78px;height:78px;font-size:38px}.tile b{display:block;font-size:26px}.tile small{color:var(--ink2);font-size:15px}
@media(max-width:760px){.hero,.big{grid-template-columns:1fr}.hero-art{display:none}}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
.book{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:250px;padding:22px 18px 18px 32px;border:2px solid var(--ink);border-radius:10px 24px 24px 10px;background:var(--c);text-align:left;box-shadow:inset 16px 0 0 #0000001a,0 6px 0 var(--ink);transition:transform .2s}
.book:hover{transform:translateY(-4px) rotate(-1deg)}
.book::after{content:"";position:absolute;inset:12px 12px 12px 26px;border:2px dashed #ffffffa8;border-radius:6px 16px 16px 6px;pointer-events:none}
.book .no{background:#fff;border:1.5px solid var(--ink);border-radius:99px;padding:1px 12px;font-size:14px;font-weight:700}
.book .t{margin-top:auto;font-size:27px;font-weight:700;letter-spacing:.06em;line-height:1.3}.book .m{font-size:14px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mode{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px 22px;border:2px solid var(--ink);border-radius:28px;background:var(--card);box-shadow:0 6px 0 var(--ink);text-align:center;transition:transform .2s}
.mode .ico{width:104px;height:104px;font-size:48px}.mode b{font-size:28px;letter-spacing:.15em}.mode small{font-size:15px;color:var(--ink2)}
.mode.on{background:#FFF3E2;transform:translateY(3px);box-shadow:0 3px 0 var(--ink),0 0 0 5px #E5714F44}
@media(max-width:760px){.modes{grid-template-columns:1fr}.mode{flex-direction:row;text-align:left;padding:14px 18px}.mode .ico{width:68px;height:68px;font-size:32px}}
.ex{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:92px;padding:18px}
.timer{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:99px;background:var(--ink);color:#fff;font:600 22px var(--n)}
.prog{height:12px;border-radius:99px;background:var(--line);border:1.5px solid var(--ink);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--leaf) 0 10px,#7CC195 10px 20px);transition:width .4s}
.dots{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.dot{height:38px;border-radius:12px;border:1.5px solid var(--ink3);background:var(--card);font:600 14px var(--n);color:var(--ink2);padding:0}
.dot.done{background:var(--leaf);color:#fff;border-color:var(--ink)}.dot.cur{box-shadow:0 0 0 3px var(--tomato);color:var(--ink)}.dot.done.cur{color:#fff}
.ref{font-size:28px;line-height:1.9;letter-spacing:.08em;background:var(--cream);border:1.5px dashed var(--sun);border-radius:18px;padding:12px 20px;margin:14px 0 0;word-break:break-all}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:72px;min-height:70px;border:2px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:0 3px 0 var(--ink);font-size:14px;font-weight:700}
.tool .ic{font-size:26px}.tool.on{background:var(--sun-l);transform:translateY(2px);box-shadow:0 1px 0 var(--ink),0 0 0 4px #F3B53F55}.tool.er.on{background:var(--rose-l)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.grid.word{grid-template-columns:repeat(auto-fit,minmax(170px,230px));justify-content:center}
.paper{position:relative;aspect-ratio:1;border:2px solid #D98E7A;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 4px 0 #EBC7BA;container-type:inline-size}
.paper canvas{position:relative;display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.paper.er{border-color:var(--plum)}
.paper.tap{display:block;width:100%;padding:0;cursor:pointer;font:inherit;color:inherit}
.paper.tap canvas{pointer-events:none;touch-action:auto}
.paper.nx{border-color:var(--tomato);box-shadow:0 0 0 4px #E5714F40,0 4px 0 #EBC7BA}
.hint{position:absolute;right:8px;bottom:4px;font-size:22px;color:var(--ink3);pointer-events:none}
.ghost{position:absolute;inset:0;display:grid;place-items:center;font-size:100px;font-size:78cqw;line-height:1;color:#E5714F26;pointer-events:none}
.cl{text-align:center;color:var(--ink3);font:600 13px var(--n);margin-top:4px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
@media(max-width:820px){.ex{grid-template-columns:1fr}.side{position:static}.dots{display:flex;overflow-x:auto}.dot{min-width:38px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* big writing pad */
body.padopen{overflow:hidden}
.pad-wrap{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));background:var(--paper);touch-action:manipulation;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pad-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pad-info{text-align:center;line-height:1.3}.pad-info b{display:block;font-size:22px}.pad-info small{color:var(--ink2);font-size:14px}
.pad-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.pad-strip>:first-child{margin-left:auto}.pad-strip>:last-child{margin-right:auto}
.mini{flex:none;width:56px;height:56px;padding:0;border:2px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.mini canvas{width:100%;height:100%;display:block;pointer-events:none}.mini.on{border-color:var(--tomato);box-shadow:0 0 0 3px #E5714F44}
.pad-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.paper.big{flex:none;border-width:3px;border-radius:18px}
.pad-side{display:flex;flex-direction:column;gap:12px;width:min(94vw,680px)}
.pad-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pad-tools .tool{min-width:0}
.pad-nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}.pad-nav .btn{padding:0 12px}
@media (orientation:landscape) and (min-width:700px){.pad-body{flex-direction:row}.pad-side{width:260px}.pad-tools{grid-template-columns:1fr 1fr}.pad-nav{grid-template-columns:1fr}}
.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:30px 22px;background:radial-gradient(circle at 50% 0,#FFEFD0,var(--card) 62%)}
.stars{display:flex;gap:8px;font-size:48px;line-height:1}.stars span{color:#E6DCCF;animation:pop .5s both}.stars span.on{color:var(--sun);text-shadow:0 3px 0 var(--ink)}
.score{font:600 92px/1 var(--n);color:var(--tomato);text-shadow:0 4px 0 var(--ink)}.score small{font-size:24px;color:var(--ink);text-shadow:none}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.stats div{min-width:110px;padding:10px 14px;border-radius:18px;background:#fff;border:1.5px solid var(--line)}.stats b{display:block;font:600 24px var(--n)}.stats small{color:var(--ink2)}
.rg{margin-top:20px;padding:16px 18px}.rg h3{font-size:19px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.rc{border:2px solid var(--line);border-radius:18px;padding:8px;background:#fff;text-align:center}
.rc.ok{border-color:var(--ok)}.rc.bad{border-color:var(--bad);background:#FFF5F2}.rc.rev{border-color:var(--rev);background:#FFF9EB}.rc.sus{border-color:var(--tomato);background:#FFF1EC}
.rc canvas{width:100%;aspect-ratio:1;display:block;border-radius:10px;border:1px solid #F0D9CF;background:#fff}
.refg{height:64px;display:grid;place-items:center;margin-top:6px}.refg svg{width:60px;height:60px}.refg b{font-size:44px;color:#7A8FA8}
.vd{font-size:14px;font-weight:700;padding:2px}.ok .vd{color:var(--ok)}.bad .vd{color:var(--bad)}.rev .vd{color:var(--rev)}.sus .vd{color:var(--tomato)}
.cd{font-size:13px;color:var(--ink2);line-height:1.4;margin-top:2px;word-break:break-all}
.jd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.jd button{min-height:38px;border-radius:10px;border:1.5px solid var(--ink);font-size:14px;font-weight:700;background:var(--card)}
.jd .p.on{background:var(--leaf);color:#fff}.jd .f.on{background:var(--bad);color:#fff}
dialog{border:2px solid var(--ink);border-radius:26px;padding:0;width:min(600px,94vw);max-height:90vh;background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--ink),0 30px 80px #3b2f2a55}
dialog.wide{width:min(1080px,96vw)}dialog::backdrop{background:#3B2F2A66;backdrop-filter:blur(4px)}
.dlg{padding:24px;overflow:auto;max-height:90vh}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.dtop h2{font-size:24px;display:flex;align-items:center;gap:8px}
.x{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:18px;flex:none}
.sticky{position:sticky;bottom:-24px;margin:16px -24px -24px;padding:14px 24px;background:#FFFDF8f4;border-top:2px dashed var(--line)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin:18px 0 8px}
.pod{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}.pod b{font-size:18px}.pod.me b{color:var(--tomato)}.pod small{font-family:var(--n);color:var(--ink2);font-size:13px}
.pod .base{width:100%;margin-top:6px;border:2px solid var(--ink);border-radius:14px 14px 4px 4px;display:grid;place-items:center;font:600 32px var(--n);color:#fff;text-shadow:0 2px 0 var(--ink)}
.r1 .base{height:104px;background:linear-gradient(#F7C95C,#F3B53F)}.r2 .base{height:76px;background:linear-gradient(#C9D4DE,#AEBBC8)}.r3 .base{height:58px;background:linear-gradient(#E9B48E,#D99A6C)}
.crown{font-size:30px;line-height:1;animation:bob 2.6s infinite}
.lrow{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:16px;background:#fff;border:1.5px solid var(--line);margin-top:8px}

function request(action,payload={},token=''){

}

 $('tlf').onsubmit=async e=>{e.preventDefault();const pw=$('tp').value,b=$('tls');b.disabled=true;try{if(needUrl){const url=$('tu').value.trim();if(!EXEC_RE.test(url))throw Error('請貼上正確的 Apps Script /exec 部署網址。');endpoint=url}const r=await request('teacherLogin',{password:pw});if(needUrl){save('-endpoint',endpoint);setConnection('Google Sheets 連線成功')}teacherToken=r.token;cfg=r.config;save('-config',cfg);closeModal();teacherTab=PUBLISHED_ENDPOINT?'papers':'deploy';screen='teacher';render();if(!PUBLISHED_ENDPOINT)toast('已連接！請在「網站部署」把網址寫進 index.html 並上載 GitHub，其他 iPad 才會一起連接。','good')}catch(err){if(needUrl)endpoint='';toast(err.message,'bad');b.disabled=false}}}
/* ---------- teacher dashboard ---------- */
function teacherView(){if(!teacherToken||!endpoint){teacherToken='';screen=user?'home':'login';return render()}
 const T=[['papers','📝','試卷覆核'],['content','📚','教材及學生'],['rules','⚖️','評分及密碼'],['deploy','🔒','網站部署']];
 $('app').innerHTML=`<div class="head"><div><div class="crumb">${ico('lock')} 只限老師</div><h1>老師工作台</h1></div><div class="row"><span class="pill on">已連接 Google Sheets</span><button class="btn sm" id="tOut">${ico('logout')} 教師登出</button></div></div><div class="tabs">${T.map(([k,e,n])=>`<button class="tab ${teacherTab===k?'on':''}" data-t="${k}">${e} ${n}</button>`).join('')}</div><section class="card pad" id="tBody"></section>`;
 $('tOut').onclick=()=>{teacherToken='';cEdit=null;screen=user?'home':'login';render()};
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{collect();teacherTab=b.dataset.t;render()});
 ({papers:tPapers,content:tContent,rules:tRules,deploy:tDeploy})[teacherTab]()}
function tPapers(){$('tBody').innerHTML=`<div class="row" style="justify-content:space-between"><div class="row"><select class="in" id="tf" style="width:auto"><option value="all">全部班別</option>${Object.keys(cfg.classes).map(k=>`<option>${esc(k)}</option>`).join('')}</select><select class="in" id="ts" style="width:auto"><option value="all">全部狀態</option><option value="todo">未覆核</option><option value="done">已覆核</option></select></div><div class="row"><button class="btn sm sky" id="tRe">${ico('refresh')} 更新</button><button class="btn sm" id="tCsv">${ico('download')} 匯出 CSV</button></div></div><p class="small muted" id="tSum"></p><div id="tList" class="tw"><div class="spin"></div></div>`;
 $('tf').onchange=$('ts').onchange=showTeacherRows;$('tRe').onclick=reloadTeacher;$('tCsv').onclick=exportCSV;reloadTeacher()}
async function reloadTeacher(){try{teacherRecords=(await request('teacherAttempts',{},teacherToken)).attempts;if($('tList'))showTeacherRows()}catch(e){toast(e.message,'bad');if($('tList'))$('tList').innerHTML='<p class="muted">未能載入，請按「更新」重試。</p>'}}
function showTeacherRows(){const f=$('tf').value,s=$('ts').value,list=teacherRecords.filter(a=>(f==='all'||a.classId===f)&&(s==='all'||(s==='done')===!!a.approved)).sort((a,b)=>String(b.created).localeCompare(String(a.created)));
 $('tSum').textContent=`共 ${teacherRecords.length} 份 · 未覆核 ${teacherRecords.filter(a=>!a.approved).length} 份`;
 $('tList').innerHTML=list.length?`<table><thead><tr><th>學生</th><th>課次</th><th>模式</th><th>分數</th><th>待核</th><th>用時</th><th>狀態</th><th></th></tr></thead><tbody>${list.map(a=>{const m=marks(a);return `<tr><td><span class="row" style="flex-wrap:nowrap">${avatar(a.name)}<span><b>${esc(a.name)}</b><br><small class="muted">${esc(a.classId)} · ${new Date(a.created).toLocaleString('zh-HK',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></span></span></td><td>${esc(lessonName(a))}</td><td>${a.mode==='memory'?'背默':'默寫'}／${scopeLabel(a.scope)}</td><td class="num"><b>${m.score}</b></td><td>${m.pending?`<span class="badge b-rev">${m.pending}</span>`:'—'}</td><td class="num">${time(a.elapsed)}</td><td>${a.approved?'<span class="badge b-ok">已覆核</span>':'<span class="badge b-rev">未覆核</span>'}</td><td><button class="btn sm sky" data-rid="${esc(a.id)}">${ico('pen')} 改分</button></td></tr>`}).join('')}</tbody></table>`:`<div class="empty">${MASCOT(80,114)}<p class="muted">還沒有交卷紀錄。</p></div>`;
 $('tList').querySelectorAll('[data-rid]').forEach(b=>b.onclick=()=>openReview(b.dataset.rid))}
function openReview(id){const src=teacherRecords.find(a=>a.id===id);if(!src)return;const a=clone(src);
 modal(`<p class="muted" style="margin-top:0">${new Date(a.created).toLocaleString('zh-HK')} · ${esc(lessonName(a))} · ${a.mode==='memory'?'背默':'默寫'}／${scopeLabel(a.scope)} · 用時 ${time(a.elapsed)} · 每錯字扣 ${a.settings.penalty} 分</p><div class="note blue">每格由上至下：學生筆跡、參考字形、電腦辨識結果。「⚠ 疑似錯字」是電腦認不出目標字；「？待核對」是電腦不太肯定。請逐字按「給分」或「扣分」。</div><div class="row" style="margin-top:12px"><button class="btn sm leaf" id="gAll">「待核對」全部給分</button><button class="btn sm danger" id="fAll">「疑似錯字」全部扣分</button></div><div id="teacherInk"><div class="spin"></div></div><div class="sticky row" style="justify-content:space-between"><b id="rvScore"></b><div class="row"><button class="btn sm" id="rvSave">儲存，稍後再看</button><button class="btn pri sm" id="rvOk">${ico('check')} 確認整卷並上榜</button></div></div>`,`${esc(a.classId)} · ${esc(a.name)} 的試卷`,true);
 reviewing=a;renderCells($('teacherInk'),a,true);updateReviewScore();
 const batch=(kind,v)=>{const list=a.cells.filter(c=>c.manual==null&&c.auto===kind&&isCounted(c.expected,a.settings));if(!list.length)return toast('沒有這類字。');if(!confirm(`將 ${list.length} 個「${kind==='suspect'?'疑似錯字':'待核對'}」設為「${v?'給分':'扣分'}」？`))return;list.forEach(c=>{c.manual=v;refreshJudge($('teacherInk'),a,c.i)});updateReviewScore()};
 $('gAll').onclick=()=>batch('review',true);$('fAll').onclick=()=>batch('suspect',false);$('rvSave').onclick=()=>saveReview(false);$('rvOk').onclick=()=>saveReview(true)}
function updateReviewScore(){if(!reviewing||!$('rvScore'))return;const m=marks(reviewing);$('rvScore').textContent=`目前 ${m.score} 分 · 給分 ${m.correct}/${m.total} · 待核 ${m.pending}`;$('rvOk').disabled=m.pending>0}
async function saveReview(approve){const a=reviewing;if(!a)return;try{const saved=(await request('review',{id:a.id,version:a.version,manual:a.cells.map(c=>c.manual),approve},teacherToken)).attempt;const i=teacherRecords.findIndex(x=>x.id===saved.id);teacherRecords[i]=saved;closeModal();showTeacherRows();toast(approve?'覆核完成，龍虎榜已更新。':'改分已保存。','good')}catch(e){toast(e.message,'bad')}}
function exportCSV(){const rows=[['班別','學生','課次','模式','範圍','分數','正確率','待核字','用時秒','已覆核','提交日期'],...teacherRecords.map(a=>{const m=marks(a);return [a.classId,a.name,lessonName(a),a.mode,scopeLabel(a.scope),m.score,m.accuracy,m.pending,a.elapsed,a.approved?'是':'否',a.created]})];const q=x=>'"'+String(x).replace(/"/g,'""')+'"';download('\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'默書成績.csv','text/csv;charset=utf-8')}
/* content editor */
const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
function collect(){if(!cEdit||!$('eStu'))return;cEdit.classes[cClass]=[...new Set(lines('eStu'))];const l=cEdit.lessons[cClass][cLesson];if(l&&$('eT')){l.title=$('eT').value.trim()||l.title;l.words=lines('eW');l.sentences=lines('eS');l.paragraph=$('eP').value.trim()}}
function tContent(){if(!cEdit)cEdit=clone(cfg);const keys=Object.keys(cEdit.classes);if(!keys.includes(cClass))cClass=keys[0];const ls=cEdit.lessons[cClass]||(cEdit.lessons[cClass]=[]);if(cLesson>=ls.length)cLesson=0;const l=ls[cLesson];
 $('tBody').innerHTML=`<div class="g2"><div><label class="f" style="margin-top:0">班別</label><div class="seg" id="cc">${keys.map(k=>`<button data-k="${esc(k)}" class="${k===cClass?'on':''}">${esc(k)}</button>`).join('')}</div><label class="f">學生姓名（每行一位）</label><textarea class="in" id="eStu" rows="9">${esc(cEdit.classes[cClass].join('\n'))}</textarea></div>
 <div><label class="f" style="margin-top:0">課次</label><div class="row"><select class="in" id="eL" style="flex:1;width:auto">${ls.map((x,i)=>`<option value="${i}" ${i===cLesson?'selected':''}>${esc(x.title)}</option>`).join('')}</select><button class="btn sm gold" id="addL">＋ 新增課次</button></div>
 ${l?`<label class="f">課次名稱</label><input class="in" id="eT" value="${esc(l.title)}"><label class="f">詞語（每行一個）</label><textarea class="in" id="eW" rows="5">${esc(l.words.join('\n'))}</textarea><label class="f">句子（每行一句，包括標點）</label><textarea class="in" id="eS" rows="4">${esc(l.sentences.join('\n'))}</textarea><label class="f">段落／背默內容</label><textarea class="in" id="eP" rows="5">${esc(l.paragraph)}</textarea>`:'<p class="muted">這班尚未有課次，請按「新增課次」。</p>'}</div></div>
 <div class="note" style="margin-top:16px">修改只影響之後開始的試卷。</div>
 <div class="row" style="justify-content:space-between;margin-top:16px">${l?`<button class="btn danger sm" id="delL">${ico('trash')} 刪除此課次</button>`:'<span></span>'}<div class="row"><button class="btn sm" id="undoC">放棄修改</button><button class="btn pri" id="saveC">${ico('check')} 保存教材及名單</button></div></div>
 <details style="margin-top:18px"><summary class="muted">進階：直接編輯完整設定 JSON</summary><textarea class="in code" id="eJ" rows="10" style="margin-top:10px">${esc(JSON.stringify(cEdit,null,2))}</textarea><button class="btn sm" id="saveJ" style="margin-top:10px">保存完整設定</button></details>`;
 $('cc').querySelectorAll('button').forEach(b=>b.onclick=()=>{collect();cClass=b.dataset.k;cLesson=0;tContent()});
 $('eL').onchange=e=>{collect();cLesson=+e.target.value;tContent()};
 $('addL').onclick=()=>{collect();const all=Object.values(cEdit.lessons).flat().map(x=>+(/^lesson(\d+)$/.exec(x.id)||[])[1]||0);const n=Math.max(1,...all)+1;ls.push({id:'lesson'+n,title:`第${n}課`,words:[],sentences:[],paragraph:''});cLesson=ls.length-1;tContent()};
 if($('delL'))$('delL').onclick=()=>{if(!confirm(`刪除「${l.title}」？（已交的試卷紀錄不會刪除）`))return;ls.splice(cLesson,1);cLesson=0;tContent()};
 $('undoC').onclick=()=>{cEdit=null;tContent()};$('saveC').onclick=()=>{collect();storeConfig(cEdit)};$('saveJ').onclick=()=>{try{storeConfig(JSON.parse($('eJ').value))}catch(e){toast('JSON 格式錯誤：'+e.message,'bad')}}}
function tRules(){const s=cfg.settings;$('tBody').innerHTML=`<div class="g2"><div><h2 style="font-size:22px">⚖️ 評分規則</h2><p class="small muted">對錯主要由 Google 手寫辨識決定；電腦不肯定的字一律交老師覆核。</p><label class="f">字形比對寬鬆度（只影響可信度數字）</label><select class="in" id="rTol"><option value="relaxed">寬鬆</option><option value="normal">一般</option></select><label class="f">每錯一字扣分</label><input class="in" type="number" id="rPen" min="0" max="10" step="1" value="${s.penalty}"><label class="f" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="rPun" ${s.punctuationCounts?'checked':''} style="width:22px;height:22px"> 標點也計扣分</label><label class="f">預設語速 <span class="muted" id="rRv">${Number(s.rate).toFixed(2)}×</span></label><input type="range" id="rRate" min="0.3" max="1" step="0.05" value="${s.rate}"><p class="small muted">新設定只用於之後開始的試卷。</p><button class="btn pri" id="rSave">${ico('check')} 保存評分設定</button></div>
 <div><h2 style="font-size:22px">🔑 教師密碼</h2><label class="f">新密碼（至少八個字元）</label><input class="in" type="password" id="pw1" autocomplete="new-password"><label class="f">再輸入一次</label><input class="in" type="password" id="pw2" autocomplete="new-password"><p class="small muted">密碼只以加密雜湊保存在 Google Apps Script 指令碼屬性，不會寫入網頁或 iPad。</p><button class="btn gold" id="pwSave">更改密碼</button></div></div>`;
 $('rTol').value=s.tolerance;$('rRate').oninput=e=>$('rRv').textContent=(+e.target.value).toFixed(2)+'×';
 $('rSave').onclick=()=>{const c=clone(cfg);c.settings={tolerance:$('rTol').value,penalty:+$('rPen').value,punctuationCounts:$('rPun').checked,rate:+$('rRate').value};storeConfig(c)};
 $('pwSave').onclick=async()=>{const p=$('pw1').value;try{if(p.length<8)throw Error('密碼至少八個字元。');if(p!==$('pw2').value)throw Error('兩次輸入的密碼不同。');await request('changePassword',{password:p},teacherToken);$('pw1').value=$('pw2').value='';toast('密碼已更改。','good')}catch(e){toast(e.message,'bad')}}}
function validateConfig(c){if(!c?.classes||!c?.lessons||!c?.settings)throw Error('設定格式不正確。');for(const k of ['4N','6B']){if(!Array.isArray(c.classes[k])||c.classes[k].some(n=>typeof n!=='string'))throw Error('名單格式不正確。');if(!Array.isArray(c.lessons[k])||c.lessons[k].some(l=>!/^[\w-]+$/.test(l.id||'')||!l.title||!Array.isArray(l.words)||!Array.isArray(l.sentences)||typeof l.paragraph!=='string'))throw Error('課次格式不正確。')}if(!['relaxed','normal'].includes(c.settings.tolerance)||!Number.isFinite(c.settings.penalty)||c.settings.penalty<0||c.settings.penalty>10||!(c.settings.rate>=.3&&c.settings.rate<=1))throw Error('評分設定不正確。')}
async function storeConfig(c){try{validateConfig(c);c=(await request('saveConfig',{config:c},teacherToken)).config;cfg=c;save('-config',cfg);cEdit=null;toast('設定已保存。','good');render()}catch(e){toast(e.message,'bad')}}
/* deploy (teacher-only) */
function tDeploy(){$('tBody').innerHTML=`<h2 style="font-size:22px">🔒 網站部署及 Google Sheets 連線</h2>
 ${PUBLISHED_ENDPOINT?'<div class="note blue">✓ 部署網址已寫入 index.html，所有 iPad 都會自動連接後台。</div>':'<div class="note">⚠ 部署網址暫時只保存在這部 iPad。請按下面「下載已設定 index.html」，上載覆蓋 GitHub；或在 GitHub 把 <code>const PUBLISHED_ENDPOINT="";</code> 引號內填上網址。完成前，學生的 iPad 仍是「本機試用」，成績不會交到你手上。</div>'}
 ${DEPLOY_STEPS}
 <div class="row"><button class="btn sky sm" id="gsCopy">${ico('book')} 複製 Code.gs</button><button class="btn sky sm" id="gsDl">${ico('download')} 下載 Code.gs</button></div>
 <label class="f">Apps Script 部署網址</label><input class="in" id="ep" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(endpoint)}">
 <div class="row" style="margin-top:12px"><button class="btn pri" id="epTest">${ico('cloud')} 更換網址並測試</button><button class="btn gold" id="epHtml">${ico('download')} 下載已設定 index.html</button>${PUBLISHED_ENDPOINT?'':'<button class="btn" id="epLocal">中斷連接</button>'}</div>
 <div class="note" style="margin-top:16px">部署網址不是密碼，寫進 index.html 是安全的。老師密碼只以加密雜湊保存在 Apps Script，切勿把密碼寫進任何檔案。</div>
 <details style="margin-top:14px"><summary>使用注意</summary><p class="small">學生只選班別和姓名，這是課堂名單辨認，不是帳戶驗證。教師登入四小時後失效。連續輸錯密碼十次會暫停登入十分鐘。</p><p class="small">手寫辨識使用 Google 手寫輸入服務（非正式公開服務，將來有機會失效；失效時有筆跡的字一律交老師覆核）。辨識時只會把筆畫座標傳給 Google，不會附上學生姓名。筆跡同時以向量座標儲存在你的 Google Sheet。</p><p class="small">參考字形：<a href="https://github.com/chanind/hanzi-writer-data" target="_blank" rel="noopener">Hanzi Writer Data</a>／Make Me a Hanzi，經 jsDelivr 下載；字形依 Arphic Public License 授權。</p></details>`;
 wireCode('gsCopy','gsDl');
 $('epTest').onclick=async()=>{const url=$('ep').value.trim(),old=endpoint;try{if(!EXEC_RE.test(url))throw Error('請貼上正確的 Apps Script /exec 部署網址。');endpoint=url;const r=await request('bootstrap');save('-endpoint',url);cfg=r.config;save('-config',cfg);teacherToken='';studentToken='';user=null;setConnection('Google Sheets 連線成功');toast('連接成功！請用新後台的密碼重新登入。','good');screen='login';render()}catch(e){endpoint=old;toast(e.message,'bad')}};
 $('epHtml').onclick=exportConfigured;
 if($('epLocal'))$('epLocal').onclick=()=>{if(!confirm('中斷這部 iPad 與後台的連接？'))return;endpoint='';save('-endpoint','');teacherToken='';studentToken='';user=null;screen='login';setConnection();render()}}
function exportConfigured(){const node=document.documentElement.cloneNode(true);node.querySelector('#app').innerHTML='';node.querySelector('#modalBody').innerHTML='';node.querySelector('#modal').removeAttribute('open');node.querySelector('#toast').className='toast';const pd=node.querySelector('#pad');pd.innerHTML='';pd.setAttribute('hidden','');node.querySelector('body').classList.remove('padopen');node.querySelectorAll('iframe,form[hidden]').forEach(n=>n.remove());const s=node.querySelector('#appScript');
 s.textContent=s.textContent.replace(new RegExp('const '+'PUBLISHED_ENDPOINT=.*;'),()=>'const PUBLISHED_ENDPOINT='+JSON.stringify(endpoint)+';').replace(new RegExp('const '+'EMBEDDED_CONFIG=.*;'),()=>'const EMBEDDED_CONFIG='+JSON.stringify(cfg).replace(/</g,'\\u003c')+';');
 download('<!doctype html>\n'+node.outerHTML,'index.html','text/html;charset=utf-8')}
/* ---------- global wiring ---------- */
$('back').onclick=()=>{if(screen==='writing'){persistDraft();screen='home'}else if(screen==='lesson'||screen==='result')screen='home';else if(screen==='ready')screen='lesson';else if(screen==='teacher'){collect();screen=user?'home':'login'}else{user=null;studentToken='';screen='login'}render()};
$('boardBtn').onclick=showBoard;$('rateBtn').onclick=audioSettings;$('teacherBtn').onclick=()=>{if(screen==='writing')return toast('請先交卷或按「稍後繼續」。');teacherLogin()};
window.addEventListener('storage',e=>{if(e.key===KEY+'-records'){records=read('-records',[]);if($('bT'))refreshBoard()}if(e.key===KEY+'-config'&&!endpoint&&screen!=='writing')cfg=read('-config',cfg)});
window.addEventListener('beforeunload',e=>{if(screen==='writing'&&attempt?.cells.some(c=>c.strokes.length)){persistDraft();e.preventDefault();e.returnValue=''}});
window.addEventListener('pagehide',persistDraft);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persistDraft()});
window.addEventListener('resize',()=>{if(!padOpen)return;clearTimeout(resizeTimer);resizeTimer=setTimeout(renderPad,250)});
document.addEventListener('keydown',e=>{if(padOpen&&e.key==='Escape')closePad()});
setInterval(()=>{if(screen==='writing'&&$('tm'))$('tm').textContent=time((Date.now()-attempt.started)/1000)},1000);
if('speechSynthesis'in window){speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices()}
try{localStorage.removeItem(KEY+'-password')}catch{}
setConnection();render();
if(endpoint&&location.protocol!=='file:')request('bootstrap').then(r=>{cfg=r.config;save('-config',cfg);setConnection('Google Sheets 連線成功');if(screen==='login')render()}).catch(e=>{setConnection('Google Sheets 連線失敗');toast(e.message,'bad')});
</script>
